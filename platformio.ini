# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.

[platformio]
include_dir = Inc
src_dir = Src
boards_dir = platformio_boards  # Additional PIO boards not supported by the ststm32 core. UNRELATED to grblHAL boards.
extra_configs = platformio.local.ini  # Custom local config/overrides, ignored by git

[common]
build_flags =
  -I .
  -I boards
  -I FatFs
  -I FatFs/STM
  -I Drivers/FATFS/Target
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/App
  -I USB_DEVICE/Target
  -D _USE_IOCTL=1
  -D _USE_WRITE=1
  -D _VOLUMES=1
  -Wl,-u,_printf_float
  -Wl,-u,_scanf_float
  # Ignore all settings in Inc/my_machine.h (and instead use build flags)
  -D OVERRIDE_MY_MACHINE
lib_deps =
  boards
  bluetooth
  grbl
  keypad
  laser
  motors
  trinamic
  odometer
  fans
  spindle
  plugins
  embroidery
  Drivers/FATFS/App
  Drivers/FATFS/Target
  # USB serial support
  Middlewares/ST/STM32_USB_Device_Library/Core
  Middlewares/ST/STM32_USB_Device_Library/Class
  USB_DEVICE/App
  USB_DEVICE/Target
  FatFs
  sdcard
  # Автоматическое скачивание стороннего плагина виртуальных входов
  https://github.com/siganberg/grblhal-virtual-inputs.git

lib_extra_dirs =
  .
  boards
  FatFs
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE

[eth_networking]
build_flags =
  -I lwip/src/include
  -I networking/wiznet
lib_deps =
   lwip
   networking
lib_extra_dirs =

[wiznet_networking]
build_flags =
  -I networking/wiznet
  -I Middlewares/Third_Party/LwIP/src/include
  -I Middlewares/Third_Party/LwIP/system
  -I Middlewares/Third_Party/LwIP/src/include/netif
  -I Middlewares/Third_Party/LwIP/src/include/lwip
lib_deps =
   networking
   webui
   Middlewares/Third_Party/LwIP
lib_extra_dirs =

[env]
platform = ststm32
platform_packages = framework-stm32cubef4 @ ~1.26.2
framework = stm32cube
lib_archive = no
lib_ldf_mode = off

# =========================================================================
# Конфигурация для вашей платы BlackPill F411CE
# =========================================================================
[env:blackpill_f411ce]
board = blackpill_f411ce
board_build.ldscript = STM32F411CEUX_FLASH.ld
build_flags = ${common.build_flags}
  -D BOARD_BLACKPILL
  -D USE_HAL_DRIVER
  -D STM32F411xE
  -D USB_SERIAL_CDC=1
  # --- Настройки OpenPnP и плагинов ---
  -D OPENPNP_ENABLE=1
  -D VIRTUAL_INPUTS_ENABLE=1
  # --- Управление периферией ---
  -D SPINDLE_ENABLE=2048
  -D FANS_ENABLE=1
  -D CONTROL_ENABLE=70
  -D PROBE_ENABLE=0
  # --- Ускорения и отскок ---
  -D HOMING_PULLOFF_ENABLE=1
  -D FEED_OVERRIDE_ENABLE=1
  -D ENABLE_JERK_ACCELERATION=1
  -D ACCELERATION_TICKS_PER_SECOND=100

lib_deps = ${common.lib_deps}
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = dfu

# =========================================================================
# Другие окружения (Оставлены для совместимости репозитория)
# =========================================================================

[env:btt_skr_pro_1_1]
board = genericSTM32F407VGT6
board_build.ldscript = STM32F407VGTX_BL32K_FLASH.ld
build_flags = ${common.build_flags}
  -D BOARD_BTT_SKR_PRO_1_1=
  -D HSE_VALUE=8000000
  -D HAS_BOOTLOADER
  -D USB_SERIAL_CDC=1
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}

[env:btt_skr_2_tmc2209]
board = genericSTM32F407VGT6
board_build.ldscript = STM32F407VGTX_BL32K_FLASH.ld
build_flags = ${common.build_flags}
  -D WEB_BUILD
  -D BOARD_BTT_SKR_20
  -D USE_HAL_DRIVER
  -D STM32F407xx
  -D HSE_VALUE=8000000
  -D USB_SERIAL_CDC=1
  -D PROBE_ENABLE=1
  -D TRINAMIC_ENABLE=2209
  -D TRINAMIC_UART_ENABLE=2
  -D BLUETOOTH_ENABLE=0
  -D NETWORKING_ENABLE=0
  -D ESTOP_ENABLE=1
  -D SPINDLE0_ENABLE=11
  -D N_SPINDLE=1
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}

[env:fysetc_s6]
board = fysetc_s6
board_build.ldscript = STM32F446RETX_NO_BL_FLASH.ld
build_flags = ${common.build_flags}
  -D BOARD_FYSETC_S6=
  -D HSE_VALUE=12000000
  -D USB_SERIAL_CDC=1
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = dfu

[env:blackpill_f401cc_uni]
board = blackpill_f401cc
board_build.ldscript = STM32F401CCUX_FLASH.ld
build_flags = ${common.build_flags}
  -D BOARD_STM32F401_UNI=
  -D HSE_VALUE=25000000
  -D USB_SERIAL_CDC=1
  -D SDCARD_ENABLE=1
  -D EEPROM_IS_FRAM=1
lib_deps = ${common.lib_deps}
  eeprom
  FatFs
  sdcard
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = stlink
